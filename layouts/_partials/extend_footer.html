
<script>
(function(){
  var toc = document.querySelector('details.toc');
  if (!toc) return;
  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var links = toc.querySelectorAll('a');
  if (!links.length) return;

  // Clean up empty nested ul
  toc.querySelectorAll('ul').forEach(function(ul) {
    var visible = ul.querySelectorAll(':scope > li:not([style*="display: none"])');
    if (visible.length === 0) ul.style.display = 'none';
  });

  var headings = [];
  links.forEach(function(link) {
    var li = link.closest('li');
    if (li && li.style.display === 'none') return;
    var id = decodeURIComponent(link.getAttribute('href').slice(1));
    var el = document.getElementById(id);
    if (el) headings.push({el: el, link: link});
  });

  function highlight() {
    var scrollY = window.scrollY + 100;
    var active = null;
    for (var i = headings.length - 1; i >= 0; i--) {
      if (headings[i].el.getBoundingClientRect().top + window.pageYOffset <= scrollY) {
        active = headings[i];
        break;
      }
    }
    links.forEach(function(l) { l.classList.remove('toc-active'); });
    if (active) {
      active.link.classList.add('toc-active');
      if (toc.scrollHeight > toc.clientHeight) {
        var linkTop = active.link.offsetTop - toc.offsetTop;
        if (linkTop < toc.scrollTop || linkTop > toc.scrollTop + toc.clientHeight - 40) {
          toc.scrollTop = linkTop - toc.clientHeight / 3;
        }
      }
    }
  }

  if (headings.length) {
    window.addEventListener('scroll', highlight);
    highlight();
  }

  // Auto-expand collapsed sections on TOC click
  links.forEach(function(link) {
    link.addEventListener('click', function(e) {
      var id = decodeURIComponent(link.getAttribute('href').slice(1));
      var target = document.getElementById(id);
      if (!target) return;
      var opened = false;
      var el = target.parentElement;
      while (el) {
        if (el.tagName === 'DETAILS' && !el.open) { el.open = true; opened = true; }
        el = el.parentElement;
      }
      if (opened) {
        e.preventDefault();
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            target.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' });
          });
        });
      }
    });
  });
})();
</script>

<script>
(function(){
  var widthPanel = document.getElementById('width-panel');
  var widthSlider = document.getElementById('width-slider');
  var widthValue = document.getElementById('width-value');
  var widthToggle = document.getElementById('width-toggle');
  var mainEl = document.querySelector('.main');

  function adjustMainMargin() {
    if (!mainEl) return;
    var toc = document.querySelector('details.toc');
    var tocW = 220;
    if (toc && toc.style.width) tocW = parseFloat(toc.style.width);
    mainEl.style.marginLeft = (10 + tocW) + 'px';
    mainEl.style.marginRight = 'auto';
  }

  var saved = sessionStorage.getItem('blog_width');
  if (saved && mainEl) {
    mainEl.style.maxWidth = saved + 'px';
    widthSlider.value = saved;
    widthValue.textContent = saved;
  } else if (mainEl) {
    mainEl.style.maxWidth = widthSlider.value + 'px';
  }
  adjustMainMargin();

  if (widthToggle) {
    widthToggle.addEventListener('click', function() {
      widthPanel.style.display = widthPanel.style.display === 'flex' ? 'none' : 'flex';
    });
  }

  widthSlider.addEventListener('input', function() {
    var v = widthSlider.value;
    widthValue.textContent = v;
    if (mainEl) mainEl.style.maxWidth = v + 'px';
    adjustMainMargin();
    sessionStorage.setItem('blog_width', v);
  });

  widthPanel.addEventListener('click', function(e) {
    if (e.target === widthPanel) widthPanel.style.display = 'none';
  });

  // TOC width slider
  var tocWidthSlider = document.getElementById('toc-width-slider');
  var tocWidthValue = document.getElementById('toc-width-value');
  var tocEl = document.querySelector('details.toc');

  var savedToc = sessionStorage.getItem('blog_toc_width');
  if (savedToc && tocEl) {
    tocEl.style.width = savedToc + 'px';
    tocWidthSlider.value = savedToc;
    tocWidthValue.textContent = savedToc;
  } else if (tocEl) {
    tocEl.style.width = tocWidthSlider.value + 'px';
  }
  adjustMainMargin();

  tocWidthSlider.addEventListener('input', function() {
    var v = tocWidthSlider.value;
    tocWidthValue.textContent = v;
    if (tocEl) tocEl.style.width = v + 'px';
    adjustMainMargin();
    sessionStorage.setItem('blog_toc_width', v);
  });
})();
</script>

<script>
(function(){
  var postContent = document.querySelector('.post-content');
  if (!postContent) return;

  var h2s = postContent.querySelectorAll('h2');
  if (!h2s.length) return;

  h2s.forEach(function(h2) {
    var details = document.createElement('details');
    details.className = 'collapsible-section';
    details.open = true; // default open

    var summary = document.createElement('summary');
    h2.parentNode.insertBefore(details, h2);
    summary.appendChild(h2);
    details.appendChild(summary);

    var body = document.createElement('div');
    body.className = 'collapse-body';

    var sibling = details.nextSibling;
    // Collect all following siblings until next h2 or end
    while (sibling) {
      var current = sibling;
      sibling = sibling.nextSibling;
      if (current.nodeType === 1 && current.tagName === 'H2') break;
      if (current.nodeType === 1 && current.tagName === 'H1') break;
      if (current.nodeType === 1 && current.tagName === 'HR') break;
      if (current.nodeType === 1 && current.tagName === 'DETAILS' && current.classList.contains('collapsible-section')) break;
      body.appendChild(current);
    }

    details.appendChild(body);
  });

  // Wrap h3 sections as collapsible subsections
  postContent.querySelectorAll('details.collapsible-section > .collapse-body').forEach(function(body) {
    var h3s = body.querySelectorAll(':scope > h3');
    h3s.forEach(function(h3) {
      var wrap = document.createElement('details');
      wrap.className = 'subsection';
      wrap.open = true;
      h3.parentNode.insertBefore(wrap, h3);
      var summary = document.createElement('summary');
      wrap.appendChild(summary);
      summary.appendChild(h3);
      var inner = document.createElement('div');
      inner.className = 'subsection-body';
      wrap.appendChild(inner);
      var sib = wrap.nextSibling;
      while (sib) {
        var cur = sib;
        sib = sib.nextSibling;
        if (cur.nodeType === 1 && (cur.tagName === 'H3' || cur.tagName === 'H2')) break;
        if (cur.nodeType === 1 && cur.classList && cur.classList.contains('subsection')) break;
        inner.appendChild(cur);
      }
    });
  });

  // Wrap h4 sections as collapsible subsubsections
  postContent.querySelectorAll('.collapse-body .subsection-body, .collapse-body').forEach(function(container) {
    var h4s = container.querySelectorAll(':scope > h4');
    h4s.forEach(function(h4) {
      var wrap = document.createElement('details');
      wrap.className = 'subsubsection';
      wrap.open = true;
      h4.parentNode.insertBefore(wrap, h4);
      var summary = document.createElement('summary');
      wrap.appendChild(summary);
      summary.appendChild(h4);
      var inner = document.createElement('div');
      inner.className = 'subsubsection-body';
      wrap.appendChild(inner);
      var sib = wrap.nextSibling;
      while (sib) {
        var cur = sib;
        sib = sib.nextSibling;
        if (cur.nodeType === 1 && /^H[2-4]$/.test(cur.tagName)) break;
        if (cur.nodeType === 1 && cur.classList && (cur.classList.contains('subsection') || cur.classList.contains('subsubsection'))) break;
        inner.appendChild(cur);
      }
    });
  });

  // Restore collapse state from sessionStorage
  var path = location.pathname;
  var states = JSON.parse(sessionStorage.getItem('collapse_state') || '{}');
  if (states[path]) {
    var allDetails = postContent.querySelectorAll('details.collapsible-section, details.subsection, details.subsubsection');
    states[path].forEach(function(open, i) {
      if (allDetails[i]) allDetails[i].open = open;
    });
  }

  // Save collapse state on toggle (h2, h3, h4)
  document.addEventListener('toggle', function(e) {
    if (e.target.classList && (e.target.classList.contains('collapsible-section') || e.target.classList.contains('subsection') || e.target.classList.contains('subsubsection'))) {
      var allDetails = postContent.querySelectorAll('details.collapsible-section, details.subsection, details.subsubsection');
      var state = [];
      allDetails.forEach(function(s) { state.push(s.open); });
      var all = JSON.parse(sessionStorage.getItem('collapse_state') || '{}');
      all[path] = state;
      sessionStorage.setItem('collapse_state', JSON.stringify(all));
    }
  });

  // Collapse/Expand all button
  var collapseBtn = document.getElementById('collapse-all-btn');
  if (collapseBtn) {
    collapseBtn.addEventListener('click', function() {
      var sections = postContent.querySelectorAll('details.collapsible-section, details.subsection, details.subsubsection');
      if (!sections.length) return;
      var anyOpen = Array.prototype.some.call(sections, function(s) { return s.open; });
      var target = !anyOpen;
      sections.forEach(function(s) { s.open = target; });
      var all = JSON.parse(sessionStorage.getItem('collapse_state') || '{}');
      var state = [];
      sections.forEach(function(s) { state.push(s.open); });
      all[location.pathname] = state;
      sessionStorage.setItem('collapse_state', JSON.stringify(all));
    });
  }
})();
</script>

<script>
function devAction(btn) {
  var action = btn.getAttribute('data-dev-action');
  var path   = (btn.getAttribute('data-dev-path') || '').replace(/\\/g, '/');
  var scheme = '', label = '';

  switch (action) {
    case 'explore-dir':
      var slash = path.lastIndexOf('/');
      path = slash >= 0 ? path.substring(0, slash + 1) : path;
      scheme = 'winfs'; label = '正在打开资源管理器...'; break;
    case 'explore-file':
      scheme = 'winfs'; label = '正在打开资源管理器...'; break;
    case 'copy-path':
      navigator.clipboard.writeText(path.replace(/\//g, '\\')).then(function() {
        var orig = btn.title; btn.title = '已复制!';
        setTimeout(function() { btn.title = orig; }, 1500);
      });
      return;
    case 'claude':
      scheme = 'cc'; label = '正在启动 Claude Code...'; break;
    case 'claude-article':
      scheme = 'cca'; label = '正在启动 Claude Code（文章上下文）...'; break;
  }

  if (scheme) window.open(scheme + ':' + encodeURI(path), '_blank');
  navigator.clipboard.writeText(path.replace(/\//g, '\\')).catch(function(){});
  if (label) {
    var orig = btn.title; btn.title = label;
    setTimeout(function() { btn.title = orig; }, 2000);
  }
}
</script>

<style>
.copy-toast {
  position: fixed;
  z-index: 9999;
  padding: 6px 14px;
  background: rgba(0,0,0,0.78);
  color: #fff;
  font-size: 13px;
  border-radius: 6px;
  pointer-events: none;
  white-space: nowrap;
  transform: translate(-50%, -120%);
  animation: copy-toast-in 0.18s ease-out, copy-toast-out 0.25s ease-in 1.2s forwards;
}
[data-theme="dark"] .copy-toast {
  background: rgba(255,255,255,0.82);
  color: #111;
}
@keyframes copy-toast-in {
  from { opacity: 0; transform: translate(-50%, -80%); }
  to   { opacity: 1; transform: translate(-50%, -120%); }
}
@keyframes copy-toast-out {
  from { opacity: 1; }
  to   { opacity: 0; }
}
</style>
<script>
(function(){
  var postContent = document.querySelector('.post-content');
  if (!postContent) return;

  // execCommand fallback for non-secure contexts (plain HTTP, file://)
  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); } catch (err) {}
    document.body.removeChild(ta);
  }

  function copyText(text) {
    if (window.isSecureContext && navigator.clipboard) {
      try {
        navigator.clipboard.writeText(text);
        return;
      } catch (err) { /* fall through to legacy */ }
    }
    legacyCopy(text);
  }

  postContent.addEventListener('contextmenu', function(e) {
    try {
      var sel = window.getSelection();
      if (!sel || sel.isCollapsed) return;

      var text = sel.toString().trim();
      if (!text) return;

      e.preventDefault();
      copyText(text);

      var toast = document.createElement('div');
      toast.className = 'copy-toast';
      toast.textContent = '已复制';
      toast.style.left = e.clientX + 'px';
      toast.style.top  = e.clientY + 'px';
      document.body.appendChild(toast);

      toast.addEventListener('animationend', function(ev) {
        if (ev.animationName === 'copy-toast-out') toast.remove();
      });
    } catch (err) {}
  });
})();
</script>

<script>
(function(){
  var KEY = 'blog_compare_off';
  function setClass(on) {
    document.documentElement.classList.toggle('compare-off', on);
    var btn = document.getElementById('compare-btn');
    if (btn) {
      btn.title = on ? '已关闭增强（对比中）· 点击恢复' : '增强已开启 · 点击关闭对比';
      btn.setAttribute('aria-label', btn.title);
    }
  }
  window.toggleCompare = function() {
    var on = !document.documentElement.classList.contains('compare-off');
    setClass(on);
    try { sessionStorage.setItem(KEY, on ? '1' : '0'); } catch (err) {}
  };
  // 页面加载时恢复对比状态（仅文章页——按钮只在文章页存在，非文章页无入口撤销）
  try {
    if (sessionStorage.getItem(KEY) === '1' && document.getElementById('compare-btn')) setClass(true);
  } catch (err) {}
})();
</script>
